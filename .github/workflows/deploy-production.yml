name: Deploy Frontend to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ vars.DEPLOY_ENVIRONMENT || 'production' }}
    env:
      DEPLOY_SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
      DEPLOY_SSH_USERNAME: ${{ secrets.SSH_USERNAME || vars.SSH_USERNAME }}
      DEPLOY_SSH_PASSWORD: ${{ secrets.SSH_PASSWORD || vars.SSH_PASSWORD }}
      DEPLOY_SSH_PORT: ${{ secrets.SSH_PORT || vars.SSH_PORT }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_API_URL: https://api.amroozcollection.com
        run: npm run build

      - name: Create deployment package
        run: |
          echo "📦 Creating deployment package..."
          # Create a tarball with built files and necessary runtime files
          tar -czf deployment.tar.gz \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.js \
            node_modules

      - name: Validate deployment credentials
        run: |
          missing=()
          [ -z "$DEPLOY_SSH_HOST" ] && missing+=("SSH_HOST/secrets or vars")
          [ -z "$DEPLOY_SSH_USERNAME" ] && missing+=("SSH_USERNAME/secrets or vars")
          [ -z "$DEPLOY_SSH_PASSWORD" ] && missing+=("SSH_PASSWORD/secrets or vars")
          [ -z "$DEPLOY_SSH_PORT" ] && missing+=("SSH_PORT/secrets or vars")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "❌ Missing deployment credentials: ${missing[*]}"
            exit 1
          fi

      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_SSH_HOST }}
          username: ${{ env.DEPLOY_SSH_USERNAME }}
          password: ${{ env.DEPLOY_SSH_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          script: |
            echo "🚀 Starting frontend deployment..."
            
            # Create deployment directory
            DEPLOY_DIR="/home/u278943707/domains/amroozcollection.com/public_html"
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR
            
            # Backup current deployment
            if [ -d ".next" ]; then
              echo "📦 Backing up current deployment..."
              tar -czf backup-$(date +%Y%m%d-%H%M%S).tar.gz .next public || true
              # Keep only last 3 backups
              ls -t backup-*.tar.gz | tail -n +4 | xargs rm -f 2>/dev/null || true
            fi
            
            echo "✅ Ready for file transfer"

      - name: Transfer build files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_SSH_HOST }}
          username: ${{ env.DEPLOY_SSH_USERNAME }}
          password: ${{ env.DEPLOY_SSH_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          source: "deployment.tar.gz"
          target: "/home/u278943707/domains/amroozcollection.com/public_html/"

      - name: Extract and restart application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_SSH_HOST }}
          username: ${{ env.DEPLOY_SSH_USERNAME }}
          password: ${{ env.DEPLOY_SSH_PASSWORD }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          script: |
            cd /home/u278943707/domains/amroozcollection.com/public_html
            
            echo "📂 Extracting build files..."
            tar -xzf deployment.tar.gz
            rm deployment.tar.gz
            
            echo "🔧 Setting permissions..."
            chmod -R 755 .next
            chmod -R 755 public
            
            echo "🔄 Restarting application..."
            # If using PM2
            if command -v pm2 &> /dev/null; then
              pm2 restart amrooz-frontend || pm2 start npm --name "amrooz-frontend" -- start
            else
              echo "⚠️  PM2 not found, manual restart may be needed"
            fi
            
            echo "✅ Frontend deployment completed successfully!"

      - name: Verify deployment
        run: |
          echo "⏳ Waiting for server to restart..."
          sleep 10
          
          echo "🔍 Checking if site is responding..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://amroozcollection.com)
          
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "✅ Frontend is responding! (HTTP $HTTP_CODE)"
          else
            echo "⚠️  Warning: Site returned HTTP $HTTP_CODE"
            exit 1
          fi
